<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="%APP_TAGLINE%" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <title>%APP_NAME%</title>
    <script>
      // Applies the theme the person chose (src/app/shell/theme.ts) before the first paint.
      try {
        var theme = localStorage.getItem("theme");
        if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
      } catch (e) {
        // Storage may be blocked; the system theme applies.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>%APP_NAME% needs JavaScript: it runs entirely in your browser.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
